# Canonical incident truth. Text placeholders:
#   {svc:<slug>}       service, rendered with a per-document alias choice
#   {svc:<slug>|name}  service, always rendered with its canonical name
#   {dpl:<DPL-ID>}     deployment, rendered as "<service> <version>" in varying styles
#   {ext:<EXT-ID>}     external system
# Fields:
#   trigger            deployment that triggered the incident (verified cause)
#   root_cause_in      service / external system where the root cause lived, when not a deployment
#   ruled_out          deployments that were suspected but verified as NOT causing the incident
#   resolved_by        deployments that resolved / mitigated it (rollbacks, hotfixes, config reverts)
#   preliminary        early hypothesis written during the incident; may be wrong on purpose
#   record             how the incident appears in the business tables when it differs from the truth
incidents:
  - id: INC-101
    title: Stale product images on product pages
    severity: 4
    primary_service: catalog-service
    affected: [{service: catalog-service, impact: primary}]
    started_at: "2026-04-09T08:10:00Z"
    detected_at: "2026-04-09T09:30:00Z"
    mitigated_at: "2026-04-09T11:00:00Z"
    resolved_at: "2026-04-09T11:00:00Z"
    cause_category: config
    trigger: DPL-004
    resolved_by: []
    summary: Product pages showed outdated or missing images for newly updated products.
    impact: Cosmetic only. About 1,200 products showed an old thumbnail for up to three hours; no orders were affected.
    detection: A merchandiser reported in #help-catalog that edited product photos were not appearing on the storefront.
    preliminary: Looks like the CDN is not picking up new uploads, possibly a CDN provider issue.
    root_cause: The new image pipeline in {dpl:DPL-004} set a one-week Cache-Control max-age on thumbnail URLs that do not change when the image changes, so the CDN kept serving the old file.
    resolution: The team purged the CDN cache for the thumbnail path and shortened max-age to ten minutes in the service configuration.
    action_items: [Version thumbnail URLs with a content hash]
    timeline:
      - {at: "09:30", text: Merchandiser reports stale images.}
      - {at: "10:15", text: "{svc:catalog-service} on-call confirms Cache-Control headers of one week."}
      - {at: "11:00", text: CDN purge completed and max-age reduced.}

  - id: INC-102
    title: Users logged out and unable to sign in
    severity: 2
    primary_service: auth-service
    affected:
      - {service: auth-service, impact: primary}
      - {service: shared-redis, impact: degraded}
      - {service: checkout-api, impact: downstream}
      - {service: api-gateway, impact: downstream}
    started_at: "2026-04-09T13:05:00Z"
    detected_at: "2026-04-09T13:12:00Z"
    mitigated_at: "2026-04-09T15:20:00Z"
    resolved_at: "2026-04-09T16:45:00Z"
    cause_category: capacity
    root_cause_in: shared-redis
    resolved_by: [DPL-005]
    summary: Customers were randomly signed out, including in the middle of checkout, and some could not log back in.
    impact: For about two hours roughly one in five active sessions was dropped. Customers lost their place in checkout and had to log in again; around 9% of login attempts failed with a generic error.
    detection: Alert AuthSessionMissRateHigh fired at 13:12 and the support queue spiked with "logged out" complaints.
    preliminary: Suspect the auth-service v6.0.0 session key prefix change from earlier this week.
    root_cause: The {svc:shared-redis} shards were at their 8 GB memory limit and the allkeys-lru eviction policy started evicting live session keys, which have no TTL priority over cache entries. Traffic growth after the spring campaign pushed memory over the limit.
    ruled_out_text: The session key prefix change shipped in auth-service v6.0.0 was reviewed and is unrelated; keys were present until evicted.
    resolution: Platform SRE switched the eviction policy to volatile-lru and doubled maxmemory to 16 GB per shard ({dpl:DPL-005}); session loss stopped immediately after the change.
    action_items: [Separate the session cache from general caches, Alert on Redis evicted_keys rate]
    timeline:
      - {at: "13:12", text: AuthSessionMissRateHigh alert fires.}
      - {at: "13:40", text: "Identity on-call sees sessions missing from {svc:shared-redis}."}
      - {at: "14:30", text: "evicted_keys counter found climbing on all shards."}
      - {at: "15:20", text: "Eviction policy and memory limit changed; errors drop."}
      - {at: "16:45", text: Incident resolved after an hour of stable metrics.}

  - id: INC-103
    title: Order confirmation emails delayed
    severity: 3
    primary_service: email-dispatcher
    affected:
      - {service: email-dispatcher, impact: primary}
      - {service: notification-service, impact: degraded}
    started_at: "2026-04-15T17:00:00Z"
    detected_at: "2026-04-15T17:40:00Z"
    mitigated_at: "2026-04-15T20:10:00Z"
    resolved_at: "2026-04-15T21:30:00Z"
    cause_category: external
    root_cause_in: EXT-MAILRELAY
    resolved_by: []
    summary: Order confirmation and shipping emails arrived up to four hours late.
    impact: About 22,000 transactional emails were delayed by up to four hours. No emails were lost.
    detection: The email queue depth alert fired when the backlog exceeded 5,000 messages.
    preliminary: Mailer workers may be stuck; restart them.
    root_cause: "{ext:EXT-MAILRELAY} started returning HTTP 429 after our sending volume exceeded the account's hourly quota during a flash sale. The {svc:email-dispatcher} retried with a fixed one-minute delay, which kept us above the quota."
    resolution: MailRelay support raised the hourly quota at 20:10 and the backlog drained by 21:30. Restarting workers had no effect.
    action_items: [Ask MailRelay for a permanent quota increase before campaigns, Exponential backoff on 429 responses]
    timeline:
      - {at: "17:40", text: Queue depth alert.}
      - {at: "18:05", text: Workers restarted without improvement.}
      - {at: "18:50", text: "429 Too Many Requests from {ext:EXT-MAILRELAY} identified."}
      - {at: "20:10", text: Quota raised by the provider.}

  - id: INC-104
    title: Card payments failing at checkout
    severity: 1
    primary_service: payments-api
    affected:
      - {service: payments-api, impact: primary}
      - {service: checkout-api, impact: downstream}
    started_at: "2026-04-22T10:12:00Z"
    detected_at: "2026-04-22T10:19:00Z"
    mitigated_at: "2026-04-22T11:05:00Z"
    resolved_at: "2026-04-22T11:40:00Z"
    cause_category: deployment
    trigger: DPL-010
    ruled_out: [DPL-009]
    resolved_by: [DPL-011]
    follow_up: [DPL-017]
    summary: Customers could not complete purchases because payment requests timed out on the final checkout step.
    impact: Roughly 38% of card payment attempts failed for 53 minutes. Shoppers saw "Your payment could not be processed" on the last step of checkout and many abandoned their carts.
    detection: The CheckoutPaymentErrorRate alert fired at 10:19 and support reported a surge of customers unable to pay.
    preliminary: The cart-service v1.12.0 release (cart merge on login) went out at 09:40, shortly before errors began, and is the main suspect.
    root_cause: The configuration refactor in {dpl:DPL-010} read the database pool size from a new PAYMENTS_DB_POOL_MAX variable that was never set in production, so every pod fell back to the default of 10 connections instead of 40. Under normal morning traffic the connection pool was exhausted within minutes; authorization requests queued waiting for a free connection and timed out after five seconds.
    trigger_text: Errors started seven minutes after {dpl:DPL-010} reached 100% of pods.
    ruled_out_text: The {svc:cart-service} release deployed at 09:40 was initially suspected because of its timing, but its error rates were flat and it does not touch the payment path. It was ruled out.
    resolution: The Payments team rolled back to v2.7.3 at 11:02 ({dpl:DPL-011}); pool utilisation fell below 50% and payment success returned to normal by 11:05. The fixed config was re-released two weeks later.
    action_items: [Fail startup when the pool is smaller than the worker count, Add pool saturation alert for Payments API, Config defaults reviewed by a second engineer]
    timeline:
      - {at: "09:40", text: "{dpl:DPL-009} deployed."}
      - {at: "10:05", text: "{dpl:DPL-010} rollout starts."}
      - {at: "10:12", text: Payment timeouts begin.}
      - {at: "10:19", text: CheckoutPaymentErrorRate alert fires; incident declared SEV1.}
      - {at: "10:35", text: "{svc:cart-service} rollback considered; dashboards show cart is healthy."}
      - {at: "10:48", text: "DB pool metrics show all 10 connections in use on every {svc:payments-api} pod."}
      - {at: "11:02", text: Rollback to v2.7.3 completed.}
      - {at: "11:05", text: Payment success rate back to baseline.}

  - id: INC-105
    title: Nightly data warehouse load failed
    severity: 4
    primary_service: warehouse-loader
    affected:
      - {service: warehouse-loader, impact: primary}
    started_at: "2026-04-28T02:00:00Z"
    detected_at: "2026-04-28T06:30:00Z"
    mitigated_at: "2026-04-29T10:10:00Z"
    resolved_at: "2026-04-29T12:00:00Z"
    cause_category: deployment
    trigger: DPL-012
    resolved_by: [DPL-013]
    summary: The nightly ETL into the analytics warehouse failed and dashboards showed no orders for April 27.
    impact: Finance and analytics dashboards were a day stale. No customer impact.
    detection: Data Platform morning check found the orders_daily table empty for the previous day.
    preliminary: Possibly a permissions problem on the orders-db read replica.
    root_cause: The schema migration in {dpl:DPL-012} renamed the column shipping_addr to shipping_address. The {svc:warehouse-loader} export query still selected the old column name and failed every night.
    resolution: "{dpl:DPL-013} updated the column mapping and the missing day was backfilled."
    action_items: [Schema change notifications to Data Platform, Contract tests for the export query]
    timeline:
      - {at: "02:00", text: Nightly load fails with column does not exist.}
      - {at: "06:30", text: Missing data noticed.}

  - id: INC-106
    title: Overselling of out-of-stock items
    severity: 2
    primary_service: inventory-service
    affected:
      - {service: inventory-service, impact: primary}
      - {service: warehouse-sync, impact: primary}
      - {service: checkout-api, impact: downstream}
    started_at: "2026-05-04T08:00:00Z"
    detected_at: "2026-05-04T10:40:00Z"
    mitigated_at: "2026-05-04T12:30:00Z"
    resolved_at: "2026-05-05T09:00:00Z"
    cause_category: deployment
    trigger: DPL-015
    resolved_by: [DPL-016]
    summary: Customers were able to buy items that were already out of stock.
    impact: 640 orders were accepted for items with no stock and had to be cancelled with an apology voucher.
    detection: Warehouse staff escalated a large number of pick failures.
    preliminary: Reservation expiry bug in inventory.
    root_cause: "{dpl:DPL-015} replaced incremental stock deltas with full snapshots processed in parallel. Snapshots from different warehouses overwrote each other's newer counts with older values, so sold-out items reappeared as in stock."
    resolution: "{svc:warehouse-sync} was rolled back to v1.9.4 ({dpl:DPL-016}) and a reconciliation script restored correct stock levels overnight."
    action_items: [Reject snapshots older than current stock version]
    timeline:
      - {at: "07:45", text: "{dpl:DPL-015} deployed."}
      - {at: "10:40", text: Pick failures escalated.}
      - {at: "12:30", text: Rollback to v1.9.4.}
      - {at: "2026-05-05 09:00", text: Reconciliation finished.}

  - id: INC-107
    title: Wrong discounts applied to orders
    severity: 3
    primary_service: pricing-service
    affected:
      - {service: pricing-service, impact: primary}
      - {service: cart-service, impact: downstream}
    started_at: "2026-05-11T08:05:00Z"
    detected_at: "2026-05-11T09:15:00Z"
    mitigated_at: "2026-05-11T10:20:00Z"
    resolved_at: "2026-05-11T10:20:00Z"
    cause_category: config
    trigger: DPL-018
    resolved_by: [DPL-019]
