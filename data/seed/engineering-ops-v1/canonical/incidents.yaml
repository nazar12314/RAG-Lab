  - id: INC-108
    title: Orders database saturation slows checkout and payments
    severity: 2
    primary_service: orders-db
    affected:
      - {service: orders-db, impact: primary}
      - {service: order-service, impact: degraded}
      - {service: payments-api, impact: degraded}
      - {service: ledger-service, impact: degraded}
      - {service: checkout-api, impact: downstream}
    started_at: "2026-05-19T13:50:00Z"
    detected_at: "2026-05-19T13:58:00Z"
    mitigated_at: "2026-05-19T14:40:00Z"
    resolved_at: "2026-05-19T15:30:00Z"
    cause_category: config
    root_cause_in: warehouse-loader
    resolved_by: [DPL-021]
    summary: Checkout and payment requests became very slow and some failed while the orders database was overloaded.
    impact: For 50 minutes p99 checkout latency exceeded 12 seconds and about 7% of payments failed with timeouts.
    detection: OrdersDbActiveConnectionsHigh fired at 13:58; Payments saw "too many connections" errors.
    preliminary: Looks like the payments connection pool problem from April again.
    root_cause: After the read replica was rebuilt on May 18, the {svc:warehouse-loader} export connection string was left pointing at the primary. An ad-hoc full-table export ran against the {svc:orders-db} primary, saturating CPU and I/O and holding hundreds of connections, which starved order, payment and ledger traffic.
    ruled_out_text: Payments API pool settings were checked and were correct (40 connections); this was not a repeat of INC-104.
    resolution: The export job was killed at 14:35 and the loader was pinned to the replica endpoint ({dpl:DPL-021}).
    action_items: [Separate database role for analytics with a connection limit, Alert when analytics queries hit the primary]
    timeline:
      - {at: "13:50", text: Export job starts against the primary.}
      - {at: "13:58", text: Active connections alert.}
      - {at: "14:20", text: "pg_stat_activity shows the export holding 300+ connections."}
      - {at: "14:35", text: Export killed.}
      - {at: "15:30", text: Loader pinned to replica.}

  - id: INC-109
    title: Elevated 502 errors on older Android app versions
    severity: 3
    primary_service: api-gateway
    affected:
      - {service: api-gateway, impact: primary}
    started_at: "2026-05-27T06:05:00Z"
    detected_at: "2026-05-27T07:20:00Z"
    mitigated_at: "2026-05-27T09:00:00Z"
    resolved_at: "2026-05-27T09:00:00Z"
    cause_category: config
    trigger: DPL-024
    resolved_by: []
    summary: Some mobile users saw connection errors after the TLS certificate rotation.
    impact: About 4% of mobile sessions, all on app versions older than 5.0, failed to connect for three hours.
    detection: Mobile crash analytics showed TLS handshake failures.
    preliminary: A CDN routing issue.
    root_cause: The certificate rotated in {dpl:DPL-024} was issued by a new intermediate CA that old app versions did not trust because they pin the previous intermediate.
    resolution: The edge was configured to serve the cross-signed chain, which older clients accept.
    action_items: [Remove certificate pinning in the next app release]
    timeline:
      - {at: "06:00", text: Certificate rotated.}
      - {at: "07:20", text: Handshake failures noticed.}
      - {at: "09:00", text: Cross-signed chain deployed.}

  - id: INC-110
    title: Legitimate payments declined after fraud check change
    severity: 2
    primary_service: payments-api
    affected:
      - {service: payments-api, impact: primary}
      - {service: fraud-service, impact: degraded}
      - {service: checkout-api, impact: downstream}
    started_at: "2026-06-01T09:00:00Z"
    detected_at: "2026-06-01T11:30:00Z"
    mitigated_at: "2026-06-02T13:15:00Z"
    resolved_at: "2026-06-02T14:00:00Z"
    cause_category: deployment
    trigger: DPL-027
    resolved_by: [DPL-028]
    summary: A spike of card declines for genuine customers after fraud scoring moved into the payment flow.
    impact: Over 28 hours about 3% of legitimate payments were declined, concentrated at peak hours.
    detection: Customer support reported customers whose cards were declined but worked elsewhere.
    preliminary: The fraud model may be too aggressive.
    root_cause: "{dpl:DPL-027} started calling the {svc:fraud-service} with a 200 ms timeout and declined the transaction whenever no score came back. At peak, fraud scoring p95 latency is around 350 ms, so many requests timed out and were declined without any fraud signal."
    ruled_out_text: The fraud model itself was unchanged; decline reasons showed "score unavailable", not high risk.
    resolution: "{dpl:DPL-028} raised the timeout to 800 ms and made low-value orders fail open when no score is available."
    action_items: [Load test new synchronous dependencies at peak traffic]
    timeline:
      - {at: "08:30", text: "{dpl:DPL-027} deployed."}
      - {at: "11:30", text: Support escalates declines.}
      - {at: "2026-06-02 10:00", text: "Decline reason 'score unavailable' identified."}
      - {at: "2026-06-02 13:15", text: Hotfix v2.9.1 deployed.}

