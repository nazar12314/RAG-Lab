  - id: INC-137
    title: Intermittent payment timeouts after HTTP client upgrade
    severity: 2
    primary_service: payments-api
    affected:
      - {service: payments-api, impact: primary}
      - {service: psp-adapter, impact: degraded}
      - {service: checkout-api, impact: downstream}
    started_at: "2026-10-28T09:25:00Z"
    detected_at: "2026-10-28T09:31:00Z"
    mitigated_at: "2026-10-28T10:05:00Z"
    resolved_at: "2026-10-28T10:30:00Z"
    cause_category: deployment
    trigger: DPL-085
    ruled_out: [DPL-084]
    resolved_by: [DPL-086]
    summary: About one in ten payments timed out for 40 minutes.
    impact: 11% of payment authorizations timed out between 09:25 and 10:05; customers could retry, and about half of them succeeded on retry.
    detection: PaymentAuthLatency alert at 09:31.
    preliminary: The fraud-service v2.5.0 release at 08:30 added fields to the score response and may be slowing payments down.
    root_cause: The HTTP client upgrade in {dpl:DPL-085} changed connection reuse so that idle keep-alive connections to the {svc:psp-adapter} were reused after the adapter had already closed them. Requests sent on those dead sockets hung until the 10 second client timeout.
    ruled_out_text: "{dpl:DPL-084} was suspected because it shipped 45 minutes earlier, but fraud scoring latency was unchanged and timeouts were only on the PSP Adapter call. It was ruled out."
    resolution: "{svc:payments-api} was rolled back to v3.3.1 at 10:05 ({dpl:DPL-086}) and timeouts stopped immediately."
    action_items: [Set idle connection timeout below the adapter's keep-alive timeout, Canary analysis for client library upgrades]
    timeline:
      - {at: "08:30", text: "{dpl:DPL-084} deployed."}
      - {at: "09:15", text: "{dpl:DPL-085} deployed."}
      - {at: "09:31", text: Latency alert.}
      - {at: "09:50", text: Timeouts isolated to the PSP Adapter call.}
      - {at: "10:05", text: Rollback complete.}
    record: {association_overrides: {DPL-084: suspected}}

