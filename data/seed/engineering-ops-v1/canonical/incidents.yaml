  - id: INC-135
    title: Event bus brokers out of disk
    severity: 2
    primary_service: event-bus
    affected:
      - {service: event-bus, impact: primary}
      - {service: notification-service, impact: downstream}
      - {service: warehouse-loader, impact: downstream}
      - {service: order-service, impact: degraded}
      - {service: inventory-service, impact: degraded}
    started_at: "2026-10-20T11:30:00Z"
    detected_at: "2026-10-20T11:34:00Z"
    mitigated_at: "2026-10-20T13:10:00Z"
    resolved_at: "2026-10-20T15:00:00Z"
    cause_category: capacity
    root_cause_in: event-bus
    resolved_by: [DPL-083]
    summary: Order and stock events stopped flowing when Kafka brokers ran out of disk, delaying notifications.
    impact: For about 100 minutes order notifications were not sent and stock events were not published; producers buffered and retried, so no events were lost.
    detection: BrokerDiskUsage alert.
    preliminary: Duplicate stock events filling disks again.
    root_cause: Event volume roughly doubled after the event bus migration, but topic retention stayed at seven days and broker disks were never resized. Disks filled and brokers stopped accepting writes.
    resolution: Retention on high-volume topics was cut to 48 hours and broker volumes were expanded ({dpl:DPL-083}).
    action_items: [Capacity review after migrations, Disk alert at 70%]
    timeline:
      - {at: "11:34", text: Disk alert.}
      - {at: "13:10", text: Old segments deleted; writes resume.}
      - {at: "15:00", text: Retention change and volume expansion completed.}

