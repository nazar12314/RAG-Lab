  - id: INC-112
    title: Profile updates failing
    severity: 3
    primary_service: accounts-service
    affected:
      - {service: accounts-service, impact: primary}
    started_at: "2026-06-14T03:20:00Z"
    detected_at: "2026-06-14T07:45:00Z"
    mitigated_at: "2026-06-14T08:30:00Z"
    resolved_at: "2026-06-14T09:00:00Z"
    cause_category: capacity
    root_cause_in: accounts-service
    resolved_by: []
    summary: Customers could not change their address or password; the save button returned an error.
    impact: About 2,300 failed profile update attempts over five hours. Logins and checkout were unaffected.
    detection: Error budget burn alert for the accounts write path.
