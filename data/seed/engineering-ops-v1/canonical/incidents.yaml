    impact: About 1,900 orders received larger discounts than intended over two hours.
    detection: Finance noticed an unusual drop in average order value.
    preliminary: Promotion rule set r42 published this morning.
    root_cause: Rule set r42 ({dpl:DPL-018}) marked two overlapping category promotions as stackable, so the {svc:pricing-service} applied both.
