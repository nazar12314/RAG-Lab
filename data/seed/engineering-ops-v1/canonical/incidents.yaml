    trigger: DPL-055
    ruled_out: [DPL-054]
    resolved_by: [DPL-056]
    summary: Payments failed and orders could not be placed while the orders database was pegged at 100% CPU.
    impact: For 75 minutes about 60% of checkouts failed, the largest outage of the quarter. Ledger postings were delayed but none were lost.
    detection: OrdersDbCpuHigh and PaymentAuthLatency alerts fired within a minute of each other at 09:04.
    preliminary: The checkout-api v5.6.0 express checkout release at 07:30 could be increasing load on payments.
    root_cause: The new settlement reconciliation endpoint in {dpl:DPL-055} ran a refund listing query without a supporting index. When the Finance dashboard started polling it at 09:00, each call scanned the full payments table on the {svc:orders-db} primary. CPU saturation slowed every query; payments, ledger and order-service connection pools were depleted and requests timed out.
    ruled_out_text: "{dpl:DPL-054} was examined first because it shipped the same morning, but its traffic pattern was unchanged and its error rate followed the database, not the other way round. It was ruled out."
    resolution: The recon_v2 feature flag was turned off at 10:10, which stopped the expensive query, and {dpl:DPL-056} added the missing index at 12:40. No rollback was needed.
    action_items: [Query plan review for new endpoints on the shared database, Per-service statement timeouts on orders-db, Rate limit for internal dashboard polling]
