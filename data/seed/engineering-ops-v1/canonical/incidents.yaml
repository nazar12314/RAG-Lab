  - id: INC-113
    title: Card processor outage - payments unavailable
    severity: 1
    primary_service: psp-adapter
    affected:
      - {service: psp-adapter, impact: primary}
      - {service: payments-api, impact: downstream}
      - {service: checkout-api, impact: downstream}
    started_at: "2026-06-20T09:05:00Z"
    detected_at: "2026-06-20T09:08:00Z"
    mitigated_at: "2026-06-20T09:52:00Z"
    resolved_at: "2026-06-20T10:30:00Z"
    cause_category: external
    root_cause_in: EXT-PAYNOVA
    ruled_out: [DPL-032]
    resolved_by: []
    summary: All card payments failed for 47 minutes because the external card processor was down.
    impact: Card payments were completely unavailable for 47 minutes; PayPal and gift cards kept working. Around 6,500 checkout attempts failed.
    detection: PspAuthorizationFailureRate alert fired at 09:08.
    preliminary: The psp-adapter v1.6.0 release this morning added support for a new PayNova API version and is the prime suspect.
    root_cause: "{ext:EXT-PAYNOVA} had a regional outage in its EU authorization cluster and returned HTTP 503 for every authorization request. The status page confirmed the outage at 09:20."
    ruled_out_text: "{dpl:DPL-032} was rolled back on a canary at 09:25 with no change in error rate, and PayNova confirmed the failures on their side. The release was not the cause and was kept."
    resolution: There was no failover processor, so the team waited for PayNova to recover at 09:52 and then monitored until 10:30.
    action_items: [Evaluate a secondary card processor, Show a clearer message suggesting alternative payment methods]
    timeline:
      - {at: "07:10", text: "{dpl:DPL-032} deployed."}
      - {at: "09:05", text: Authorization failures begin.}
      - {at: "09:20", text: PayNova status page reports an outage.}
      - {at: "09:25", text: Canary rollback shows no improvement.}
      - {at: "09:52", text: PayNova recovers.}

  - id: INC-114
    title: Shopping carts emptied after Redis failover
    severity: 3
    primary_service: cart-service
    affected:
      - {service: cart-service, impact: primary}
      - {service: shared-redis, impact: primary}
    started_at: "2026-06-26T21:10:00Z"
    detected_at: "2026-06-26T21:25:00Z"
    mitigated_at: "2026-06-26T21:30:00Z"
    resolved_at: "2026-06-27T09:00:00Z"
    cause_category: infra
    root_cause_in: shared-redis
    resolved_by: [DPL-035]
    summary: Customers found their shopping carts empty.
    impact: Roughly 180,000 stored carts were lost. Customers had to re-add items; no orders were affected.
    detection: Spike in "my cart is empty" contacts.
    preliminary: Cart TTL change from April expiring carts early.
    root_cause: A hardware failure triggered a failover of the cart shard in {svc:shared-redis}. Persistence was disabled, so the promoted replica started with an incomplete dataset after a full resync.
    resolution: AOF persistence was enabled on cart and session shards ({dpl:DPL-035}); the Cart Service later added a database fallback.
    action_items: [Enable persistence on stateful Redis shards, Fallback storage for logged-in carts]
    timeline:
      - {at: "21:10", text: Redis node failure and failover.}
      - {at: "21:25", text: Complaints spike.}
      - {at: "2026-06-27 09:00", text: AOF enabled.}

