  - id: INC-116
    title: Event consumers lagging after broker upgrade
    severity: 3
    primary_service: event-bus
    affected:
      - {service: event-bus, impact: primary}
      - {service: warehouse-loader, impact: downstream}
    started_at: "2026-07-08T06:30:00Z"
    detected_at: "2026-07-08T07:00:00Z"
    mitigated_at: "2026-07-08T10:00:00Z"
    resolved_at: "2026-07-08T12:00:00Z"
    cause_category: deployment
    trigger: DPL-040
    resolved_by: []
    summary: Consumers of the event bus fell hours behind after the Kafka upgrade.
    impact: Analytics data was delayed by up to five hours. Order notification webhooks were not affected because notifications still used the Order Service webhook at that time.
    detection: Consumer lag alert for the warehouse-loader group.
    preliminary: Broker disk performance.
    root_cause: The switch to cooperative rebalancing in {dpl:DPL-040} combined with a too-short session timeout caused a rebalance storm; consumers kept losing partition assignments before committing offsets.
    resolution: Consumer session timeouts were raised from 10 to 45 seconds and lag recovered.
