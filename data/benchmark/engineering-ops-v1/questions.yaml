# Gold benchmark labels. Never expose this file or its derived tables to retrievers or the agent.
# required_facts      every fact needed for a complete answer (drives complete-evidence rate)
# supporting_facts    helpful context; not required for completeness
# acceptable_documents  documents that satisfy document-finding questions
# expected_paths      chains of curated-graph edges [source, RELATION, target]
# suggested_tools / first_tools   human-labeled suitable tools for agent evaluation
# All questions are asked "as of" the dataset date (2026-11-01) unless stated.
questions:
  # ---------------------------------------------------------------- showcase (20)
  - id: Q-001
    split: showcase
    category: exact_id
    question: What happened in INC-104?
    reference_answer: >-
      INC-104 was a SEV1 incident on 22 April 2026 in which card payments failed at checkout.
      Payments API v2.8.0 left the database connection pool at 10 instead of 40 connections, the
      pool was exhausted and payment requests timed out. It was resolved by rolling back to v2.7.3.
    accepted_answers: [payments-api v2.8.0, connection pool exhausted, rollback to v2.7.3]
    answer_type: text
    required_facts: [F-INC-104-OVERVIEW, F-INC-104-SUMMARY, F-INC-104-CAUSE, F-INC-104-RESOLUTION]
    suggested_tools: [exact_lookup, fetch_evidence]
    first_tools: [exact_lookup]

