  - id: Q-007
    split: showcase
    category: semantic
    question: Why did shoppers suddenly find their baskets empty at the end of June?
    reference_answer: >-
      INC-114: a hardware failure caused a failover of the cart shard in Shared Redis, and because
      persistence was disabled the promoted replica had lost the carts.
    accepted_answers: [INC-114, Redis failover without persistence]
    answer_type: text
    required_facts: [F-INC-114-SUMMARY, F-INC-114-CAUSE]
    suggested_tools: [semantic_search, fetch_evidence]
    first_tools: [semantic_search]

